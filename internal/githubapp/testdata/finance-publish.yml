name: Build and publish container

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: services-publish-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set application version
        id: version
        run: echo "version=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}

      - name: Test application
        run: npm test

      - name: Install browser for PWA verification
        run: npx playwright install --with-deps chromium

      - name: Test production single-page PWA
        run: npm run test:browser

  publish:
    name: Publish container to GHCR
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set application version
        id: version
        run: echo "version=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/everyonesoftware/finance
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-

      - name: Set up Node.js for Services payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build and push image
        id: services_push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}




