name: Logs CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      component:
        description: Force a platform build, or refresh downloads without rebuilding
        type: choice
        options: [all, android, windows, web, maintenance]
        default: all
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      web: ${{ steps.select.outputs.web }}
      android: ${{ steps.select.outputs.android }}
      windows: ${{ steps.select.outputs.windows }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install the pinned workflow-test YAML parser
        run: npm install --prefix "$RUNNER_TEMP/logs-ci" --no-save --no-package-lock --ignore-scripts yaml@2.8.3
      - name: Test release tooling and workflow integration
        env:
          NODE_PATH: ${{ runner.temp }}/logs-ci/node_modules
        run: node --test scripts/*.test.mjs
      - name: Select platforms and derive the source version
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'auto' }}
        run: node scripts/release.mjs select

  web:
    needs: validate
    if: needs.validate.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Install the pinned browser-test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.58.2
      - name: Install Chromium and runner dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Build and export the Linux x64 Docker image
        working-directory: .
        run: |
          image="logs-web:$VERSION"
          mkdir -p dist/web
          docker build --platform linux/amd64 --file apps/web/Dockerfile \
            --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" \
            --tag "$image" .
          docker image save "$image" | gzip > "dist/web/logs-web-$VERSION-linux-amd64.tar.gz"
          docker image rm "$image"
      - name: Load and start the exported image
        working-directory: .
        run: |
          image="logs-web:$VERSION"
          docker image load --input "dist/web/logs-web-$VERSION-linux-amd64.tar.gz"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = node
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$GITHUB_SHA"
          docker run --detach --name logs-web-ci --publish 127.0.0.1::4173 "$image"
          address=$(docker port logs-web-ci 4173/tcp)
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 --retry-max-time 20 --max-time 5 "http://$address/version.json"
          echo "LOGS_WEB_TEST_URL=http://$address" >> "$GITHUB_ENV"
      - name: Run the Logs web browser tests
        env:
          LOGS_WEB_TEST_VERSION: ${{ needs.validate.outputs.version }}
        run: npm test
      - name: Stop the smoke-test container
        if: always()
        run: |
          if docker container inspect logs-web-ci >/dev/null 2>&1; then
            docker logs logs-web-ci
            docker rm --force logs-web-ci
          fi
      - name: Stage the tested Docker archive and its checksum
        working-directory: .
        run: node scripts/release.mjs stage web "$VERSION" "$GITHUB_SHA"
      - name: Retain the runnable Docker image
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-${{ github.sha }}
          path: dist/web/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  android:
    needs: validate
    if: needs.validate.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      signing_missing: ${{ steps.package.outputs.signing_missing }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the Android compile SDK and build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test, lint, and check the unsigned release build
        run: bash apps/android/gradlew -p apps/android :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon
      - name: Enable KVM for the hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the native activity on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: ANDROID_SERIAL=emulator-5554 bash apps/android/gradlew -p apps/android :app:connectedDebugAndroidTest --no-daemon
      - name: Package and stage Android only with the release signing identity
        id: package
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          LOGS_KEYSTORE_BASE64: ${{ secrets.LOGS_KEYSTORE_BASE64 }}
          LOGS_KEYSTORE_PASSWORD: ${{ secrets.LOGS_KEYSTORE_PASSWORD }}
          LOGS_KEY_ALIAS: ${{ secrets.LOGS_KEY_ALIAS }}
          LOGS_KEY_PASSWORD: ${{ secrets.LOGS_KEY_PASSWORD }}
        shell: bash
        run: |
          names=(LOGS_KEYSTORE_BASE64 LOGS_KEYSTORE_PASSWORD LOGS_KEY_ALIAS LOGS_KEY_PASSWORD)
          configured=0
          for name in "${names[@]}"; do
            if [[ -n "${!name:-}" ]]; then configured=$((configured + 1)); fi
          done
          if (( configured == 0 )); then
            echo '::notice::Android release signing is not configured; no Android package will be published.'
            echo 'signing_missing=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if (( configured != ${#names[@]} )); then
            echo '::error::Android release signing is partially configured; provide all four LOGS signing secrets or none.'
            exit 1
          fi
          bash scripts/package-android.sh "$VERSION" "$GITHUB_SHA"
          unset "${names[@]}"
          node scripts/release.mjs stage android "$VERSION" "$GITHUB_SHA"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Retain the staged signed APK and release metadata
        id: upload
        if: steps.package.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-android-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          overwrite: true

  windows:
    needs: validate
    if: needs.validate.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'
      - name: Run the Windows investigation and XAML contract checks
        run: dotnet run --project apps/windows/Logs.Tests -c Release
      - name: Package the native Windows installer
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: ./scripts/package-windows.ps1 $env:VERSION $env:GITHUB_SHA
      - name: Install, launch, and uninstall Logs on a disposable runner
        timeout-minutes: 7
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'dist/windows/LogsWindows-win-x64-Setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'logs-installer-smoke'
          $registry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LogsWindows'
          $exe = Join-Path $installDir 'current\Logs.exe'
          $updater = Join-Path $installDir 'Update.exe'
          $app = $null
          if ((Test-Path $installDir) -or (Test-Path $registry) -or (Test-Path (Join-Path $env:LOCALAPPDATA 'LogsWindows'))) {
            throw 'Installer smoke requires a clean, disposable Windows runner.'
          }
          function Invoke-Installer([string]$File, [string[]]$Arguments) {
            $process = Start-Process -FilePath $File -ArgumentList $Arguments -WorkingDirectory $env:RUNNER_TEMP -PassThru
            if (-not $process.WaitForExit(150000)) {
              $process.Kill($true)
              throw "Timed out waiting for $File"
            }
            if ($process.ExitCode -ne 0) { throw "$File exited with $($process.ExitCode)" }
          }
          try {
            Invoke-Installer $installer @('--silent', '--installto', ('"{0}"' -f $installDir))
            if (!(Test-Path $exe) -or !(Test-Path (Join-Path $installDir 'current\resources.pri')) -or !(Test-Path $updater)) {
              throw 'Installed Logs executable, WinUI resources, or uninstaller missing.'
            }
            $startupLog = Join-Path $env:RUNNER_TEMP 'logs-startup.txt'
            $app = Start-Process -FilePath $exe -WorkingDirectory $env:RUNNER_TEMP -RedirectStandardError $startupLog -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            do {
              Start-Sleep -Milliseconds 250
              $app.Refresh()
              if ($app.HasExited) {
                if (Test-Path $startupLog) { Get-Content $startupLog }
                throw "Installed Logs exited before displaying its window: $($app.ExitCode)"
              }
            } until (($app.MainWindowHandle -ne [IntPtr]::Zero -and $app.MainWindowTitle -eq 'Logs') -or [DateTime]::UtcNow -ge $deadline)
            if ($app.MainWindowHandle -eq [IntPtr]::Zero -or $app.MainWindowTitle -ne 'Logs') { throw 'Installed Logs window never appeared.' }
            Write-Host 'Installed Logs displayed its native window.'
          } finally {
            if ($app -and !$app.HasExited -and (!$app.CloseMainWindow() -or !$app.WaitForExit(10000))) {
              $app.Kill($true)
              $null = $app.WaitForExit(10000)
            }
            if (Test-Path $updater) {
              Invoke-Installer $updater @('--uninstall', '--silent')
              $deadline = [DateTime]::UtcNow.AddSeconds(30)
              while (((Test-Path $exe) -or (Test-Path $registry)) -and [DateTime]::UtcNow -lt $deadline) { Start-Sleep -Milliseconds 250 }
              if ((Test-Path $exe) -or (Test-Path $registry)) { throw 'Logs installation remained after uninstall.' }
            }
          }
      - name: Stage the verified Windows installer and update inventory
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: node scripts/release.mjs stage windows $env:VERSION $env:GITHUB_SHA
      - name: Retain the staged Windows artifacts
        id: upload
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-windows-${{ github.sha }}
          path: dist/windows/
          if-no-files-found: error
          overwrite: true

  release:
    needs: [validate, web, android, windows]
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.LOGS_PUBLISH_RELEASES == 'true' &&
      needs.validate.result == 'success' &&
      (needs.web.result == 'success' || (needs.web.result == 'skipped' && needs.validate.outputs.web == 'false')) &&
      (needs.android.result == 'success' || (needs.android.result == 'skipped' && needs.validate.outputs.android == 'false')) &&
      (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && needs.validate.outputs.windows == 'false'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      packages: write
    concurrency:
      group: logs-release-publication
      cancel-in-progress: false
      queue: max
    env:
      LOGS_PUBLISH_RELEASES: ${{ vars.LOGS_PUBLISH_RELEASES }}
      TARGET_COMPONENT: ${{ github.event_name == 'workflow_dispatch' && inputs.component || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - name: Restore this run's signed Android artifacts
        id: android_download
        if: needs.android.result == 'success' && needs.android.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logs-android-${{ github.sha }}
          path: dist/android
          digest-mismatch: error
      - name: Restore this run's Windows installer and update inventory
        id: windows_download
        if: needs.windows.result == 'success' && needs.windows.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logs-windows-${{ github.sha }}
          path: dist/windows
          digest-mismatch: error
      - name: Restore this run's tested Docker archive
        if: needs.web.result == 'success' && needs.web.outputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logs-web-${{ github.sha }}
          path: dist/web
          digest-mismatch: error
      - name: Verify and publish retained artifacts, then repair download tables
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ANDROID_SIGNING_MISSING: ${{ needs.android.outputs.signing_missing }}
        run: node scripts/release.mjs publish
      - name: Publish the verified Web image to GitHub Container Registry
        if: steps.publish.outputs.web_registry_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.publish.outputs.web_registry_version }}
          WEB_REGISTRY_REUSE: ${{ steps.publish.outputs.web_registry_reuse }}
        run: node scripts/publish-web-image.mjs
