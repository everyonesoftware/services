services:
  services:
    image: ghcr.io/everyonesoftware/services:${APP_VERSION:-latest}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0}
    container_name: services
    restart: unless-stopped
    group_add:
      - "0"
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      DOCKER_SOCKET: /var/run/docker.sock
      SERVICES_DATA_DIR: /data
      SERVICES_ALLOWED_HOSTS: ${SERVICES_ALLOWED_HOSTS:-}
      SERVICES_PUBLIC_ORIGIN: ${SERVICES_PUBLIC_ORIGIN:-}
      SERVICES_WEBHOOK_URL: ${SERVICES_WEBHOOK_URL:-}
      SERVICES_PUBLISH_TOKEN: ${SERVICES_PUBLISH_TOKEN:-}
      SERVICES_PUBLISH_REPOSITORIES: ${SERVICES_PUBLISH_REPOSITORIES:-}
      SERVICES_PROJECT_NAME: ${SERVICES_PROJECT_NAME:-services}
      SERVICES_COMPOSE_HOST_ROOT: ${SERVICES_COMPOSE_HOST_ROOT:-E:/Containers}
      SERVICES_COMPOSE_MOUNT_ROOT: ${SERVICES_COMPOSE_MOUNT_ROOT:-/run/desktop/mnt/host/e/Containers}
    volumes:
      - services-data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - type: bind
        source: "${SERVICES_COMPOSE_HOST_ROOT:-E:/Containers}"
        target: ${SERVICES_COMPOSE_MOUNT_ROOT:-/run/desktop/mnt/host/e/Containers}
        read_only: true
        bind:
          create_host_path: false

volumes:
  services-data:
