services:
  services:
    build: .
    container_name: services
    restart: unless-stopped
    group_add:
      - "0"
    ports:
      - "8080:8080"
    environment:
      LISTEN_ADDR: ":8080"
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
