<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#23695b" />
    <title>Services — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f6f5f1; color: #243b34; font: 16px/1.6 system-ui, sans-serif; }
      main { width: 100%; max-width: 440px; }
      svg { width: 56px; height: 56px; }
      h1 { margin: 24px 0 12px; font-size: 28px; line-height: 1.2; letter-spacing: -0.7px; }
      p { color: #56675f; margin: 0 0 16px; }
      button { margin-top: 8px; min-height: 44px; padding: 10px 20px; border: 0; border-radius: 8px; background: #23695b; color: #fffefa; font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #23695b; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <svg aria-label="Services" role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="#23695b"/><path d="M5 16h5l4-9 5 18 3-9h5" fill="none" stroke="#fffefa" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Services is offline</h1>
      <p>Unable to reach your Services server. Check your network or Tailnet connection, then try again.</p>
      <p>Live status and management actions require a connection. No actions are queued while offline.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
