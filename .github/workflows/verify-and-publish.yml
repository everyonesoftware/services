name: verify-and-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep each mutable-tag push and its notification together. queue:max retains
# up to 100 pending runs; overflow is cancelled. This is not global dispatch
# ordering and cannot serialize publishers outside this concurrency group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('services-pr-{0}-{1}', github.repository, github.event.pull_request.number) || format('services-publish-{0}', github.repository) }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate commit-count version
        id: version
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Run publish notification tests
        run: node --test scripts/*.test.mjs

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Build container image
        run: docker build --build-arg APP_VERSION=${{ steps.version.outputs.value }} --tag services:${{ steps.version.outputs.value }} .

  publish:
    name: Publish image to GHCR
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.capture.outputs.tags }}
      repository: ${{ steps.capture.outputs.repository }}
      version: ${{ needs.verify.outputs.version }}
      published_at: ${{ steps.capture.outputs.published_at }}
      notification_artifact: ${{ steps.capture.outputs.artifact }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js for payload capture
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and publish image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ needs.verify.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Capture immutable publish notification immediately after push
        id: capture
        # Notification bookkeeping must not turn a successful image push red.
        continue-on-error: true
        env:
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
          PUBLISHED_TAGS: ${{ steps.meta.outputs.tags }}
          APP_VERSION: ${{ needs.verify.outputs.version }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs capture

      - name: Persist publish notification for retries and failed-job reruns
        if: steps.capture.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.capture.outputs.artifact }}
          path: ${{ runner.temp }}/services-publish/published.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
          include-hidden-files: false
          archive: true

  notify:
    name: Notify Services of published image
    needs: publish
    if: github.event_name != 'pull_request' && needs.publish.result == 'success' && vars.SERVICES_PUBLISH_NOTIFICATIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require captured payload and federated Tailscale configuration
        env:
          PAYLOAD_ARTIFACT: ${{ needs.publish.outputs.notification_artifact }}
          TAILSCALE_CLIENT_ID: ${{ vars.TAILSCALE_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.TAILSCALE_AUDIENCE }}
          TAILSCALE_TAGS: ${{ vars.TAILSCALE_TAGS }}
        run: |
          test -n "$PAYLOAD_ARTIFACT" && test -n "$TAILSCALE_CLIENT_ID" && test -n "$TAILSCALE_AUDIENCE" && test -n "$TAILSCALE_TAGS" || {
            echo '::error::Missing captured publish payload or Tailscale federation configuration'
            exit 1
          }

      - name: Restore original publish payload
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.publish.outputs.notification_artifact }}
          path: ${{ runner.temp }}/services-publish
          digest-mismatch: error

      - name: Join private tailnet with workload identity federation
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TAILSCALE_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_AUDIENCE }}
          tags: ${{ vars.TAILSCALE_TAGS }}
          log-mode: quiet

      - name: Send captured publish notification
        env:
          SERVICES_PUBLISH_URL: ${{ vars.SERVICES_PUBLISH_URL }}
          SERVICES_PUBLISH_TOKEN: ${{ secrets.SERVICES_PUBLISH_TOKEN }}
          SERVICES_PUBLISH_PAYLOAD_PATH: ${{ runner.temp }}/services-publish/published.json
        run: node scripts/publish-notification.mjs send

  notification-failure:
    name: Report notification failure independently of image publish
    needs: [publish, notify]
    if: always() && github.event_name != 'pull_request' && vars.SERVICES_PUBLISH_NOTIFICATIONS == 'true' && needs.publish.result == 'success' && needs.notify.result == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report successful push but unacknowledged notification
        run: |
          echo '::error::Image publish succeeded, but Services did not acknowledge its notification. Re-run failed jobs to resend the original retained payload without republishing.'
          echo '### Services publish notification failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The image was published successfully. Inspect the notify job; re-run failed jobs to retry its original payload (retained for 30 days). Missing or expired artifacts fail closed and are never reconstructed from current registry state.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
